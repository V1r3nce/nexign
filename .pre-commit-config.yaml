exclude: (venv/)
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: python
        types: [python]
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        types: [python]
        args: [--fix]
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        types: [python]
      - id: isort
        name: isort
        entry: isort
        language: python
        types: [python]

