[tool.pytest.ini_options]
addopts = [
  "--clean-alluredir",
  "--alluredir=allure-results",
  "--allure-link-pattern",
  "issue:https://{}",
  "--allure-link-pattern",
  "link:https://{}",
  "--allure-link-pattern",
  "tms:https://{}",
  "-ra",
  "--color=yes",
  "--browser-channel=chrome",
  "--video=retain-on-failure",
  "--tracing=retain-on-failure",
  "-s",
  "-v"
]
markers = [
    "sanity: sanity tests",
    "regress: regression tests",
    "smoke: smoke tests",
    "extended_regress: regress test for rarely use",
    "influencing: test that can influence other",
    "nbss_portal_mock: test nbss_portal in mock mode",
    "nbss_portal: tests for NBSS_PORTAL UI",
    "lis: tests for LIS UI",
    "cpm: tests for CPM UI",
    "apc: tests for APC",
    "csm: tests for CSM",
    "gus: tests for GUS",
    "nwm: tests for NWM",
    "pm: tests for payment_management",
    "psc: tests for PSC",
    "refdata: tests for Refdata UI",
    "praim: tests for PRAIM",
    "bia: tests for Billing UI",
    "uniblp: tests for UNIBLP UI",
    "user: specify user with business role for UI login",
    "udb: tests for UDB UI",
    "crab: tests for CRAB",
    "dgs: tests for DGS",
    "nlm: tests for NLM",
    "sso: tests for SSO",
    "epm: tests for EPM",
    "lam: tests for LAM",
    "grafana: tests for Grafana",
    "nbss_portal_mock: test nbss_portal in mock mode",
    "back: backend tests"
]
log_cli = true
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_level = "INFO"
[tool.ruff]
line-length = 121
indent-width = 4
lint.select = [
  "E",
  "W",
  "F",
  "UP"
]
lint.ignore = [
  "E731", # do not assign a lambda expression, use def
  "E501", # line too long
  "E203", # whitespace before :
  "UP006", # Use `list` instead of `List` for type annotation
  "UP035", # `typing.List` is deprecated, use `list` instead
  "I" # disable import ordering checks
]
[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
docstring-code-line-length = 121
exclude = ["venv/"]
[tool.mypy]
python_version = "3.13"
follow_untyped_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true # Запрещает функции без аннотаций типов. Все функции должны быть явно типизированы.
disallow_incomplete_defs = true # Запрещает частично типизированные функции (например, если типизированы только некоторые аргументы).
check_untyped_defs = true # Включает проверку типов для функций без аннотаций типов.
disallow_untyped_decorators = true # Запрещает использование нетипизированных декораторов.
warn_unused_ignores = true # Включает предупреждение, если игнорирование типов (через `# type: ignore`) не нужно.
warn_no_return = true # Включает предупреждение, если функция не возвращает значение, хотя должна (например, забыт `return`).
warn_unreachable = true # Включает предупреждение, если код недостижим (например, после `return` или `raise`).
disable_error_code = ["assignment", "import-untyped", "misc", "arg-type", "no-any-return", "operator", "index", "override", "union-attr", "attr-defined"]
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def"]
[tool.isort]
profile = "black"
line_length = 121